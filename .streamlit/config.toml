[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true
# Check the app's own files for changes by polling. The default watcher (watchdog, inotify) watches the whole
# folder, overflows on the thousands of files torch and transformers put in .venv, and then re-scans in a loop.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
